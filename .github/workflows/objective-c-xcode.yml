name: Build iOS App

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build App (Unsigned)
        run: |
          # Buscar el archivo .xcodeproj o .xcworkspace automáticamente
          if [ -d "*.xcworkspace" ]; then
            workspace=$(ls -d *.xcworkspace)
            scheme=$(xcodebuild -workspace "$workspace" -list -json | ruby -rjson -e 'puts JSON.parse(STDIN.gets)["workspace"]["schemes"][0]')
            echo "Compilando workspace: $workspace con esquema: $scheme"
            xcodebuild -workspace "$workspace" -scheme "$scheme" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          else
            project=$(ls -d *.xcodeproj)
            scheme=$(xcodebuild -project "$project" -list -json | ruby -rjson -e 'puts JSON.parse(STDIN.gets)["project"]["targets"][0]')
            echo "Compilando proyecto: $project con esquema: $scheme"
            xcodebuild -project "$project" -scheme "$scheme" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          fi
